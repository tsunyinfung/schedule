<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竹園總站巴士實時倒數</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 20px; color: #333; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
        .card { background: #fff; width: 100%; max-width: 420px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); border-top: 6px solid #007bff; }
        h2 { margin: 0 0 5px 0; color: #007bff; font-size: 22px; text-align: center; }
        .sub { color: #666; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .eta-box { font-size: 15px; font-weight: bold; margin: 12px 0; padding: 10px 12px; background: #f8f9fa; border-radius: 8px; }
        .route-title { color: #333; font-size: 16px; margin-bottom: 6px; display: block; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
        .time-line { color: #333; font-size: 15px; margin-top: 4px; display: block; font-weight: normal; }
        .btn { display: block; width: 100%; background: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚌 竹園總站開出</h2>
    <div class="sub">實時分秒倒數 (每10秒更新)</div>
    
    <div class="eta-box">
        <span class="route-title">路線 1 (往 尖沙咀碼頭)</span>
        <div id="eta1">載入中...</div>
    </div>

    <div class="eta-box">
        <span class="route-title">路線 2B (往 長沙灣)</span>
        <div id="eta2b">載入中...</div>
    </div>

    <div class="eta-box">
        <span class="route-title">路線 11C (往 上秀茂坪)</span>
        <div id="eta11c">載入中...</div>
    </div>

    <div class="eta-box">
        <span class="route-title">路線 11K (往 紅磡站)</span>
        <div id="eta11k">載入中...</div>
    </div>

    <div class="eta-box">
        <span class="route-title">路線 103 (往 蒲飛路)</span>
        <div id="eta103">載入中...</div>
    </div>

    <button class="btn" onclick="fetchAllData()">🔄 立即更新</button>
</div>

<script>
const routesConfig = [
    { route: '1', elementId: 'eta1' },
    { route: '2B', elementId: 'eta2b' },
    { route: '11C', elementId: 'eta11c' },
    { route: '11K', elementId: 'eta11k' },
    { route: '103', elementId: 'eta103' }
];

let rawDataCache = {};
let countdownTimer = null;

async function fetchAllData() {
    routesConfig.forEach(rc => {
        const el = document.getElementById(rc.elementId);
        if (el.innerText === "載入中...") {
            el.style.color = "#666";
        }
    });

    await Promise.all(routesConfig.map(rc => fetchRouteData(rc.route, rc.elementId)));

    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(updateAllCountdowns, 1000);
}

async function fetchRouteData(routeNo, elementId) {
    const el = document.getElementById(elementId);
    try {
        const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${routeNo}/1`);
        const json = await response.json();

        if (json.data && json.data.length > 0) {
            const etas = json.data.filter(e => e.seq === 1 && e.dir === "O" && e.service_type === 1);
            rawDataCache[routeNo] = etas;
            updateElement(el, etas);
        } else {
            rawDataCache[routeNo] = [];
            el.style.color = "#888";
            el.innerText = "暫無實時班次";
        }
    } catch (error) {
        rawDataCache[routeNo] = [];
        el.style.color = "#d9534f";
        el.innerText = "連線失敗";
    }
}

function updateElement(el, etas) {
    if (!etas || etas.length === 0) {
        el.style.color = "#888";
        el.innerText = "暫無實時班次";
        return;
    }

    el.style.color = "#333";
    let htmlOutput = "";

    etas.forEach((e, index) => {
        let timeStr = "";
        let clockStr = "";

        if (!e.eta) {
            timeStr = e.rmk_tc ? e.rmk_tc : "暫無班次";
        } else {
            const now = new Date();
            const etaDate = new Date(e.eta);
            const diffMs = etaDate - now;

            // 格式化 XX:XX am/pm
            let hours = etaDate.getHours();
            const minutes = etaDate.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            const minutesFormatted = minutes < 10 ? '0' + minutes : minutes;
            clockStr = `${hours}:${minutesFormatted} ${ampm}`;

            if (diffMs <= 0) {
                timeStr = "將至";
            } else {
                const totalSecs = Math.floor(diffMs / 1000);
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                timeStr = `${mins} 分 ${secs} 秒`;
            }
        }

        if (clockStr) {
            htmlOutput += `<span class="time-line">第 ${index + 1} 班: <strong style="color: #d9534f;">${timeStr}</strong> (${clockStr})</span>`;
        } else {
            htmlOutput += `<span class="time-line">第 ${index + 1} 班: <strong style="color: #d9534f;">${timeStr}</strong></span>`;
        }
    });

    el.innerHTML = htmlOutput;
}

function updateAllCountdowns() {
    routesConfig.forEach(rc => {
        const el = document.getElementById(rc.elementId);
        if (rawDataCache[rc.route]) {
            updateElement(el, rawDataCache[rc.route]);
        }
    });
}

// 網頁載入時執行
fetchAllData();

// 每 10 秒向伺服器更新一次最新數據
setInterval(fetchAllData, 10000);
</script>

</body>
</html>
